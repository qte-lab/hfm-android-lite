name: Code Lines Count
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  count-lines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
      - name: Install cloc
        run: sudo apt-get install -y cloc
      - name: Count lines
        run: cloc .
