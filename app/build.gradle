plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.google.dagger.hilt.android'
}

def getLocalProperty(String key) {
    Properties properties = new Properties()
    def localPropertiesFile = rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        properties.load(new FileInputStream(localPropertiesFile))
    }
    return properties.getProperty(key)
}

android {
    namespace "com.chronie.homemoneylite"
    compileSdk rootProject.ext.compileSdkVersion
    
    defaultConfig {
        applicationId "com.chronie.homemoneylite"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        
        versionCode = 3100
        versionName = "3.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        
        vectorDrawables {
            useSupportLibrary true
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }
    
    signingConfigs {
        release {
            storeFile file(getLocalProperty('RELEASE_STORE_FILE') ?: 'release.keystore')
            storePassword getLocalProperty('RELEASE_STORE_PASSWORD') ?: ''
            keyAlias getLocalProperty('RELEASE_KEY_ALIAS') ?: ''
            keyPassword getLocalProperty('RELEASE_KEY_PASSWORD') ?: ''
        }
    }
    
    buildTypes {
        release {
            // A 方案：开启 R8 收缩（tree-shaking）+ 资源收缩，但“不混淆”。
            // 只收缩不重命名，可大幅减小 dex/内存占用、提升低性能设备流畅度，
            // 同时避免 Retrofit/Gson/OkHttp 因类名被改而产生的网络/解析错误。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
    
    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.1.1'
    }

    packagingOptions {
            exclude '/META-INF/{AL2.0,LGPL2.1}'
            exclude 'META-INF/LICENSE.md'
            exclude 'META-INF/NOTICE.md'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.9'
    
    // Kotlin
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.0'
    
    // Android Core
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    
    // Jetpack Compose (pinned to 1.1.x + Material 2 to stay compatible with compileSdk 31)
    implementation 'androidx.compose.ui:ui:1.1.0'
    implementation 'androidx.compose.ui:ui-graphics:1.1.0'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.1.0'

    // Material 2 (classic Compose Material)
    implementation 'androidx.compose.material:material:1.1.0'
    implementation 'androidx.compose.material:material-icons-extended:1.1.0'

    // Accompanist SwipeRefresh：MD2 时代的下拉刷新，替代 material3 的 PullToRefreshBox
    // 注意：本项目 Compose 固定为 1.1.0，必须用 0.20.x（0.20.3 是 1.1.0 对应的稳定线）；
    // 0.23+ 要求 Compose 1.1.1、0.24+ 要求 Compose 1.2.0，会触发版本冲突。0.24.9-alpha 此版本根本不存在。
    implementation 'com.google.accompanist:accompanist-swiperefresh:0.20.3'
    // Accompanist Insets：为 Compose 1.1.0 提供 statusBarsPadding / navigationBarsPadding
    // （Compose 1.2+ 才内置 WindowInsets API，本项目固定在 1.1.0，必须用 accompanist-insets 0.20.x）
    implementation 'com.google.accompanist:accompanist-insets:0.20.3'
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.5.1'
    
    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.4.0'
    
    // Hilt
    implementation 'com.google.dagger:hilt-android:2.41'
    kapt 'com.google.dagger:hilt-compiler:2.41'
    implementation 'androidx.hilt:hilt-navigation-compose:1.0.0'
    
    // Room
    implementation 'androidx.room:room-runtime:2.4.3'
    implementation 'androidx.room:room-ktx:2.4.3'
    kapt 'androidx.room:room-compiler:2.4.3'
    
    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.10.0'
    
    // Paging
    implementation 'androidx.paging:paging-runtime-ktx:3.1.1'
    
    // Coil for image loading (AI feature) - 1.4.x is compatible with Compose 1.1.x
    implementation 'io.coil-kt:coil-compose:1.4.0'
    
    // Security
    implementation 'androidx.security:security-crypto:1.0.0'
    implementation 'net.zetetic:sqlcipher-android:4.5.7@aar'
    implementation 'androidx.sqlite:sqlite:2.2.0'
    
    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.7.1'
    implementation 'androidx.hilt:hilt-work:1.0.0'
    kapt 'androidx.hilt:hilt-compiler:1.0.0'
    
    // fastExcel for Excel import/export
    implementation 'org.dhatim:fastexcel:0.12.15'
    implementation 'org.dhatim:fastexcel-reader:0.12.15'
    // aalto-xml: StAX implementation for fastExcel (javax.xml.stream API is provided by Android framework)
    implementation 'com.fasterxml:aalto-xml:1.3.2'
    // XZ compression library for commons-compress
    implementation 'org.tukaani:xz:1.9'
    
    // uCrop for image cropping
    implementation 'com.github.yalantis:ucrop:2.2.8'
    
    // Testing
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'io.mockk:mockk:1.12.4'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.6.1'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.1.0'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.1.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.1.0'
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception ignored) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
