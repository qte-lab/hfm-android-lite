plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

def getLocalProperty(String key) {
    Properties properties = new Properties()
    def localPropertiesFile = rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        properties.load(new FileInputStream(localPropertiesFile))
    }
    return properties.getProperty(key)
}

android {
    packagingOptions {
        jniLibs {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/LICENSE.md', 'META-INF/NOTICE.md']
        }
    }
    namespace "com.chronie.homemoneylite"
    compileSdk rootProject.ext.compileSdkVersion
    
    defaultConfig {
        applicationId "com.chronie.homemoneylite"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        
        // 仅保留中文资源，剔除其他语言字符串资源，减小安装包体积、降低低端机内存占用
        resourceConfigurations = ["zh"]
        
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        
        versionCode = 4000
        versionName = "4.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        
        vectorDrawables {
            useSupportLibrary true
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }
    
    signingConfigs {
        release {
            storeFile file(getLocalProperty('RELEASE_STORE_FILE') ?: 'release.keystore')
            storePassword getLocalProperty('RELEASE_STORE_PASSWORD') ?: ''
            keyAlias getLocalProperty('RELEASE_KEY_ALIAS') ?: ''
            keyPassword getLocalProperty('RELEASE_KEY_PASSWORD') ?: ''
        }
    }
    
    buildTypes {
        release {
            // A 方案：开启 R8 收缩（tree-shaking）+ 资源收缩，但“不混淆”。
            // 只收缩不重命名，可大幅减小 dex/内存占用、提升低性能设备流畅度，
            // 同时避免 Retrofit/Gson/OkHttp 因类名被改而产生的网络/解析错误。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    
    buildFeatures {
        viewBinding true
    }


}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    
    // Kotlin
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    
    // Android Core
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    
    // ===== 传统 View 体系（XML 迁移目标，compileSdk 31 约束：material 只能用 1.5.x，1.6+ 需要 compileSdk 32）=====
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // 图表库（替换手写的趋势折线 / 分类柱状 / 星期雷达三张 Canvas 图）
    implementation 'com.github.PhilJay:MPAndroidChart:3.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.5.6'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    // Coil 基础库（ImageView.load 扩展）
    implementation 'io.coil-kt:coil:2.7.0'

    // Hilt（版本须与根 build.gradle 的 hilt 插件版本一致）
    implementation 'com.google.dagger:hilt-android:2.60.1'
    ksp 'com.google.dagger:hilt-compiler:2.60.1'
    
    // Room
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'
    
    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.4.0'
    
    // Paging
    implementation 'androidx.paging:paging-runtime-ktx:3.5.0'
    
    // Security
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'net.zetetic:sqlcipher-android:4.17.0@aar'
    implementation 'androidx.sqlite:sqlite:2.7.0'
    
    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'androidx.hilt:hilt-work:1.4.0'
    ksp 'androidx.hilt:hilt-compiler:1.4.0'
    
    // fastExcel for Excel import/export
    implementation 'org.dhatim:fastexcel:0.20.2'
    implementation 'org.dhatim:fastexcel-reader:0.20.2'
    // aalto-xml: StAX implementation for fastExcel (javax.xml.stream API is provided by Android framework)
    implementation 'com.fasterxml:aalto-xml:1.4.0'
    // XZ compression library for commons-compress
    implementation 'org.tukaani:xz:1.12'
    
    // uCrop for image cropping
    implementation 'com.github.yalantis:ucrop:2.2.11'
    
    // Testing
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'io.mockk:mockk:1.14.11'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception ignored) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
