import java.util.*

plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
    id 'dagger.hilt.android.plugin'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// 使用更兼容的日期格式化方式
def getBuildDate() {
    def calendar = Calendar.getInstance()
    def year = calendar.get(Calendar.YEAR)
    def month = calendar.get(Calendar.MONTH) + 1
    def day = calendar.get(Calendar.DAY_OF_MONTH)
    return String.format("%04d%02d%02d", year, month, day)
}

def getBuildTime() {
    def calendar = Calendar.getInstance()
    def hour = calendar.get(Calendar.HOUR_OF_DAY)
    def minute = calendar.get(Calendar.MINUTE)
    return String.format("%02d%02d", hour, minute)
}

def getLocalProperty(String key) {
    Properties properties = new Properties()
    def localPropertiesFile = rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        properties.load(new FileInputStream(localPropertiesFile))
    }
    return properties.getProperty(key)
}

android {
    namespace "com.chronie.homemoney"
    compileSdk rootProject.ext.compileSdkVersion
    
    defaultConfig {
        applicationId "com.chronie.homemoney"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        
        ndk {
            abiFilters 'arm64-v8a'
        }
        
        def buildDate = getBuildDate()
        def defaultBuildNumber = getBuildTime()
        def buildNumber = project.hasProperty("buildNumber") ? project.buildNumber : defaultBuildNumber
        
        versionCode = (System.currentTimeMillis() / 1000).intValue()
        versionName = "1.${buildDate}.${buildNumber}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        
        vectorDrawables {
            useSupportLibrary true
        }
        
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }
    
    signingConfigs {
        release {
            storeFile file(getLocalProperty('RELEASE_STORE_FILE') ?: 'release.keystore')
            storePassword getLocalProperty('RELEASE_STORE_PASSWORD') ?: ''
            keyAlias getLocalProperty('RELEASE_KEY_ALIAS') ?: ''
            keyPassword getLocalProperty('RELEASE_KEY_PASSWORD') ?: ''
        }
    }
    
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    buildFeatures {
        compose true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/LICENSE.md'
            excludes += 'META-INF/NOTICE.md'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    
    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    
    // Android Core
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    
    // Jetpack Compose
    implementation platform('androidx.compose:compose-bom:2026.05.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'

    implementation("com.github.Kyant0:m3color:2026.1")
    // Material 3 Expressive (requires 1.14.0+)
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha21'
    implementation 'androidx.compose.material3:material3-window-size-class:1.5.0-alpha21'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation "androidx.activity:activity-compose:$androidxActivityVersion"
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    
    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.9.8'
    
    // Hilt
    implementation 'com.google.dagger:hilt-android:2.59.2'
    ksp 'com.google.dagger:hilt-compiler:2.59.2'
    implementation 'androidx.hilt:hilt-navigation-compose:1.3.0'
    
    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    
    // Room
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'
    
    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'
    
    // Paging
    implementation 'androidx.paging:paging-runtime-ktx:3.5.0'
    implementation 'androidx.paging:paging-compose:3.5.0'
    
    // Coil for image loading (AI feature)
    implementation 'io.coil-kt:coil-compose:2.7.0'
    
    // Security
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'net.zetetic:sqlcipher-android:4.16.0@aar'
    implementation 'androidx.sqlite:sqlite:2.6.2'
    
    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'androidx.hilt:hilt-work:1.3.0'
    ksp 'androidx.hilt:hilt-compiler:1.3.0'
    
    // fastExcel for Excel import/export
    implementation 'org.dhatim:fastexcel:0.20.1'
    implementation 'org.dhatim:fastexcel-reader:0.20.1'
    // aalto-xml: StAX implementation for fastExcel (javax.xml.stream API is provided by Android framework)
    implementation 'com.fasterxml:aalto-xml:1.4.0'
    // XZ compression library for commons-compress
    implementation 'org.tukaani:xz:1.12'
    
    // uCrop for image cropping
    implementation 'com.github.yalantis:ucrop:2.2.11'
    
    // Testing
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'io.mockk:mockk:1.14.11'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation platform('androidx.compose:compose-bom:2026.05.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
